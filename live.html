<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mikkeller Airways Kamera</title>
<meta name="description" content="Peg kameraet mod København-trykket på t-shirten, og se det vågne.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Work+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #010103; --paper: #EEE5D2; --yellow: #F5E14B; --red: #DA3A35; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font: 500 15px/1.4 "Work Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #ar { position: fixed; inset: 0; overflow: hidden; }
  #ar video { object-fit: cover; }
  .frame { position: fixed; left: 50%; top: 47%; width: min(78vw, 440px); aspect-ratio: 4 / 3; transform: translate(-50%, -50%); pointer-events: none; transition: opacity 0.3s; z-index: 5; }
  .frame i { position: absolute; width: 34px; height: 34px; border: 4px solid #fff; border-radius: 4px; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5)); animation: pulse 1.1s ease-in-out infinite; }
  .frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  .frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  .frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  .frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .hint { position: fixed; left: 50%; bottom: max(36px, calc(env(safe-area-inset-bottom) + 24px)); transform: translateX(-50%); z-index: 5; background: rgba(1,1,3,0.72); padding: 10px 16px; border-radius: 999px; white-space: nowrap; backdrop-filter: blur(8px); transition: opacity 0.3s; }
  .tracking .frame, .tracking .hint { opacity: 0; }
  .sound { position: fixed; right: 14px; top: max(14px, env(safe-area-inset-top)); z-index: 6; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 9px 14px 9px 11px; background: rgba(1,1,3,0.6); color: #fff; font: inherit; font-weight: 700; backdrop-filter: blur(8px); cursor: pointer; }
  .sound svg { width: 20px; height: 20px; }
  .sound.on .wave { opacity: 1; } .sound .wave { opacity: 0; }
  .sound.on span { display: none; }
  .msg { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 28px; text-align: center; background: #000; }
  .msg[hidden] { display: none; }
  .msg p { margin: 0 auto 16px; max-width: 320px; color: #ddd; }
  .msg b { display: block; font-family: "Bowlby One", sans-serif; font-weight: 400; font-size: 22px; color: #fff; margin-bottom: 8px; }
  .msg button { border: 0; border-radius: 999px; padding: 13px 24px; background: var(--paper); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
  .spin { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .frame i, .spin { animation: none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
<div id="ar"></div>
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="hint" id="hint">Peg kameraet mod trykket på t-shirten</div>
<button class="sound" id="sound" aria-label="Slå lyd til">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <span>Lyd</span>
</button>

<div class="msg" id="loading"><div><div class="spin"></div><p>Starter kameraet …</p></div></div>
<div class="msg" id="error" hidden>
  <div>
    <b>Kameraet er ikke tændt</b>
    <p id="errText">Giv siden lov til at bruge kameraet, og prøv igen.</p>
    <button id="retry">Prøv igen</button>
  </div>
</div>

<script type="module" src="js/live.js"></script>
</body>
</html>
